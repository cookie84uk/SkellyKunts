<main class="wrap" data-check="market-page">
  <section class="panel lit halftone mt">
    <div class="panel-head">
      <h2>The Market</h2>
      <span class="dim small">every listed Skelly, with what's inside it</span>
    </div>
    <div class="mk-head" id="mk-head" data-check="mk-head"></div>
    <div class="mk-lookup mt">
      <input class="lst-input" id="mk-id" type="number" min="1" max="1100" inputmode="numeric" placeholder="Skelly number (1–1100)" aria-label="Skelly number">
      <button class="btn sm" id="mk-go" type="button">Look up</button>
      <select class="mk-sort" id="mk-sort" aria-label="Sort listings">
        <option value="price">Sort: price</option>
        <option value="awake">Sort: awake first</option>
        <option value="level">Sort: level</option>
      </select>
    </div>
    <div class="mt" id="mk-card" data-check="mk-card"></div>
    <div class="mk-grid mt" id="mk-grid" data-check="mk-grid"></div>
  </section>
</main>
