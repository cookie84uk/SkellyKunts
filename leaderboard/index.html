<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkellyKuntz — Leaderboards</title>
<meta name="description" content="Skelly Roll players by net PnL, the Skellies earning the most, and what is happening across the Skellyverse right now.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/skelly.css?v=20260929190000">
</head>
<body>

<main class="wrap" data-check="leaderboard-page">
  <section class="panel lit halftone mt">
    <div class="panel-head">
      <h2>Skelly Roll — leaderboard</h2>
      <span class="dim small">ranked by net PnL · <a href="/roll/">play Skelly Roll →</a></span>
    </div>
    <div class="filters" id="rl-period">
      <button class="btn xs on" type="button" data-p="day">24h</button>
      <button class="btn xs" type="button" data-p="week">7 days</button>
      <button class="btn xs" type="button" data-p="all">All time</button>
      <span class="dim small" id="rl-note"></span>
    </div>
    <div id="rl-biggest" class="mt"></div>
    <div class="mt" id="rl-table"></div>
  </section>

  <section class="panel lit halftone mt">
    <div class="panel-head">
      <h2>Skellies — top earners</h2>
      <span class="dim small">reward ETH paid into each Skelly</span>
    </div>
    <div class="filters" id="sk-period">
      <button class="btn xs on" type="button" data-p="day">24h</button>
      <button class="btn xs" type="button" data-p="week">7 days</button>
      <button class="btn xs" type="button" data-p="all">All time</button>
      <span class="dim small" id="sk-note"></span>
    </div>
    <div class="mt" id="sk-table"></div>
  </section>

  <section class="panel lit halftone mt">
    <div class="panel-head">
      <h2>Activity</h2>
      <span class="dim small">latest first · updates on its own</span>
    </div>
    <ul class="lb-list" id="feed"></ul>
  </section>
</main>

<script src="/config.js?v=20260929190000"></script>
<script src="/vendor/ethers.umd.min.js?v=20260929190000"></script>
<script src="/js/ui.js?v=20260929190000"></script>
<script src="/js/leaderboard.js?v=20260929190000"></script>
</body>
</html>
